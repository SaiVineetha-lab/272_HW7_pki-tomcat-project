# TLS server certificate request
# Based on the "Simple PKI" from https://pki-tutorial.readthedocs.io/en/latest/simple/
# The SAN is read from the SAN environment variable, e.g.
#   SAN=DNS:localhost,DNS:www.simple.org,IP:127.0.0.1

[ default ]
SAN                     = DNS:localhost         # Default value

[ req ]
default_bits            = 2048                  # RSA key size
encrypt_key             = no                    # Protect private key (no, so Tomcat can start unattended)
default_md              = sha256                # MD to use
utf8                    = yes                   # Input is UTF-8
string_mask             = utf8only              # Emit UTF-8 strings
prompt                  = no                    # Don't prompt for DN
distinguished_name      = server_dn             # DN section
req_extensions          = server_reqext         # Desired extensions

[ server_dn ]
0.domainComponent       = "org"
1.domainComponent       = "simple"
organizationName        = "Simple Inc"
organizationalUnitName  = "Simple Web Server"
commonName              = "www.simple.org"

[ server_reqext ]
keyUsage                = critical,digitalSignature,keyEncipherment
extendedKeyUsage        = serverAuth,clientAuth
subjectKeyIdentifier    = hash
subjectAltName          = $ENV::SAN
